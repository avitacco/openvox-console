<!doctype html>
<html lang="en">

      rel="stylesheet"
    />
    <title>Packages - OpenVox Console</title>
    <script>
      (function () {
        var stored = localStorage.getItem('vox-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-vox-theme', theme);
      })();
    </script>
    <style>
      html { background-color: #f5faf9; }
      html[data-vox-theme='dark'] { background-color: #0d1417; }
      html:not([data-vox-ready]) body { visibility: hidden; }
    </style>
    <noscript><style>body { visibility: visible !important; }</style></noscript>
    <script>
      setTimeout(function () {
        document.documentElement.setAttribute('data-vox-ready', '');
      }, 2000);
    </script>
    <link rel="stylesheet" href="/vendor/voxblocks.css" />
    <link rel="stylesheet" href="/shell.css" />
    <script type="module" src="/vendor/voxblocks.js"></script>
    <script type="module" src="/packages.js"></script>
  </head>
  <body>
    <vox-header site-title="OpenVox Console" href="/">

      <vox-theme-toggle slot="actions"></vox-theme-toggle>
      <vox-menu label="Account menu" slot="actions">
        <vox-avatar slot="trigger" id="user-avatar" size="sm"></vox-avatar>
        <a href="/preferences.html">Preferences</a>
        <hr />
        <button type="button" id="logout-button">Log out</button>
      </vox-menu>
    </vox-header>

    <div class="app-main vox-display-flex vox-items-start vox-gap-xl vox-p-all-lg">
      <div style="flex: 0 0 13rem;">
        <vox-sidenav label="Main">
          <vox-sidenav-item href="/">
            <vox-icon slot="icon" name="dashboard"></vox-icon>
            Dashboard
          </vox-sidenav-item>
          <vox-sidenav-item href="/nodes.html">
            <vox-icon slot="icon" name="plug"></vox-icon>
            Nodes
          </vox-sidenav-item>
          <vox-sidenav-item href="/packages.html" current>
            <vox-icon slot="icon" name="collection"></vox-icon>
            Packages
          </vox-sidenav-item>
          <vox-sidenav-item href="/vulnerabilities.html" id="nav-vulnerabilities-link" style="display: none">
            <vox-icon slot="icon" name="vulnerability"></vox-icon>
            Vulnerabilities
          </vox-sidenav-item>
          <vox-sidenav-item href="/groups.html">
            <vox-icon slot="icon" name="node-group"></vox-icon>
            Groups
          </vox-sidenav-item>
          <vox-sidenav-item href="/jobs.html" id="nav-jobs-link" style="display: none">
            <vox-icon slot="icon" name="orchestrate"></vox-icon>
            Jobs
          </vox-sidenav-item>
          <vox-sidenav-item href="/deploys.html" id="nav-deploys-link" style="display: none">
            <vox-icon slot="icon" name="deploy"></vox-icon>
            Deploys
          </vox-sidenav-item>
          <vox-sidenav-item href="/activity.html" id="nav-activity-link" style="display: none">
            <vox-icon slot="icon" name="activity-log"></vox-icon>
            Activity
          </vox-sidenav-item>
          <vox-sidenav-item href="/users.html" id="nav-admin-link" style="display: none">
            <vox-icon slot="icon" name="people"></vox-icon>
            Admin
          </vox-sidenav-item>
        </vox-sidenav>
      </div>
      <div style="flex: 1 1 auto; min-width: 0;">
        <main class="vox-container vox-p-y-xl">
      <h1 class="vox-ts-xl vox-m-bottom-lg">Packages</h1>

      <div id="search-error"></div>

      <div class="filters vox-display-flex vox-items-end vox-gap-md vox-flex-wrap vox-m-bottom-md">
        <vox-input id="name-filter" label="Package name" placeholder="Filter by name"></vox-input>
        <vox-input id="version-filter" label="Version" placeholder="Filter by version"></vox-input>
        <vox-select id="provider-filter" label="Provider">
          <option value="">All</option>
        </vox-select>
        <vox-select id="group-filter" label="Group" style="display: none">
          <option value="">All</option>
        </vox-select>
      </div>

      <div id="coverage" class="vox-ts-sm vox-m-bottom-md"></div>
      <div id="results"></div>
    </main>
      </div>
    </div>

    <vox-footer>
      <vox-footer-column heading="OpenVox Console">
        <a href="https://openvoxproject.github.io/" target="_blank" rel="noopener">OpenVox project</a>

      </vox-footer-column>
      <div slot="bottom" class="vox-display-flex vox-justify-between vox-items-center">
        <span><a href="/LICENSE" target="_blank" rel="noopener">License (GPL-3.0)</a></span>
        <span>Version <span id="footer-version">&hellip;</span></span>
      </div>
    </vox-footer>

    </body>
</html>
