<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,600;1,500&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Log in - OpenVox Console</title>
    <script>
      (function () {
        var stored = localStorage.getItem('vox-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-vox-theme', theme);
      })();
    </script>
    <style>
      html { background-color: #f5faf9; }
      html[data-vox-theme='dark'] { background-color: #0d1417; }
      html:not([data-vox-ready]) body { visibility: hidden; }
    </style>
    <noscript><style>body { visibility: visible !important; }</style></noscript>
    <script>
      setTimeout(function () {
        document.documentElement.setAttribute('data-vox-ready', '');
      }, 2000);
    </script>
    <link rel="stylesheet" href="/vendor/voxblocks.css" />
    <link rel="stylesheet" href="/shell.css" />
    <script type="module" src="/vendor/voxblocks.js"></script>
    <script type="module" src="/login.js"></script>
  </head>
  <body>
    <main class="vox-container vox-p-y-xl login-container">
      <h1 class="vox-ts-xl vox-m-bottom-md" data-i18n>OpenVox Console</h1>

      <div id="form-error"></div>

      <div class="vox-m-bottom-md">
        <vox-input id="username" label="Username" required data-i18n-attr="label"></vox-input>
      </div>
      <div class="vox-m-bottom-md">
        <vox-input id="password" label="Password" type="password" required data-i18n-attr="label"></vox-input>
      </div>

      <vox-button id="login-button" variant="brand" data-i18n>Log in</vox-button>

      <div id="oidc-login" style="display: none">
        <p data-i18n>or</p>
        <vox-button id="oidc-login-button" variant="ghost" href="/api/v1/auth/oidc/login" data-i18n>Log in with SSO</vox-button>
      </div>
    </main>
    </body>
</html>
