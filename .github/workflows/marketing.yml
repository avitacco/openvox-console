name: Marketing site

# Builds and publishes the marketing site to GitHub Pages.
#
# Deliberately separate from ci.yml. That workflow builds and publishes
# the container images, and a failure to build a marketing page must not
# stop a release from shipping - nor should a site publish wait on the
# image matrix. The two share no jobs and no artifacts.
#
# One-time setup a maintainer has to do by hand, which no workflow can do
# for itself: Settings -> Pages -> Source -> "GitHub Actions". Until then
# this builds successfully and fails at the deploy step.

on:
  push:
    branches: [main]
    paths:
      # Only the site and the things it is generated from. A change to
      # the console does not republish the site; a screenshot refresh
      # does, because the images are part of the site's content.
      - "marketing/**"
      - ".github/workflows/marketing.yml"
  # Manual runs, for republishing after enabling Pages or after a
  # settings change.
  workflow_dispatch:

# Pages needs these; nothing else in this workflow writes anything.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. Queued rather than cancelled: a half-finished
# deployment that got cancelled is worse than a slightly stale one.
concurrency:
  group: marketing-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The site takes voxblocks from the frontend's lockfile rather than
      # a second package.json, so the frontend's dependencies are what
      # gets installed here.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Screenshot capture deliberately does NOT run here. It needs the
      # whole compose stack and a seeded console, and the images it would
      # produce are already committed. Running it per push would be slow
      # and would defeat the point of images that are byte-stable between
      # refreshes. The build fails if a declared screenshot is missing,
      # so a forgotten capture is caught here rather than published.
      - name: Build
        run: ./marketing/build.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: marketing/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
