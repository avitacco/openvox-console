name: Marketing site

# Rebuilds the marketing site and publishes it to GitHub Pages whenever
# a push to main changes the site's sources or its screenshots.
#
# Separate from ci.yml and release.yml on purpose: a site problem must not
# block a release, and a release must not wait on the site.
#
# Screenshot capture does NOT run here. It needs the full compose stack
# and a seeded console, so the images are committed under
# docs/assets/screenshots and this workflow only renders the pages around
# them. build.sh fails if a declared screenshot is missing.
#
# One-time setup: Settings -> Pages -> Source -> "GitHub Actions". Until
# that is switched this builds fine and fails at the deploy step.
on:
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - "docs/assets/screenshots/**"
      - "frontend/package-lock.json" # voxblocks version comes from here
      - ".github/workflows/marketing.yml"
  # Manual republish, e.g. right after switching the Pages source.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queued, not cancelled: a cancelled half-finished deploy is worse than a
# slightly stale site.
concurrency:
  group: marketing-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The site takes voxblocks from the frontend's lockfile, so the
      # frontend's dependencies are what get installed.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      # Regenerates docs/ in the runner's checkout, so what is published
      # always matches the sources rather than whatever was committed.
      - name: Build
        run: ./marketing/build.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
