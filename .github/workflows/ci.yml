name: CI

# Tests only. Nothing is built or published from a branch or PR: images
# and releases come from release.yml, which runs when a v* tag is pushed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # The Postgres-backed tests skip themselves when
      # CONSOLE_TEST_POSTGRES_DSN is unset. Giving CI a real database
      # means they actually run rather than silently passing.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: console
          POSTGRES_PASSWORD: console
          POSTGRES_DB: console
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U console"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # internal/web/dist and internal/agentdist/{bin,packages} are
      # generated, not committed, and are go:embed inputs - without them
      # the build fails with "pattern all:bin: no matching files found".
      - name: Generate embedded assets
        run: |
          ./frontend/build.sh
          make agent-binaries
          make agent-packages

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          CONSOLE_TEST_POSTGRES_DSN: postgres://console:console@localhost:5432/console?sslmode=disable
        # -p 1 because the Postgres-backed tests share one database and
        # would otherwise race each other across packages.
        run: go test -p 1 ./...
